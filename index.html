<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>RHU Dupax del Norte ABTC — Live Camera Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { margin: 0; background: #111827; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .top { width: 100%; background: #1a4d2e; padding: 14px 16px; text-align: center; }
    .top h1 { margin: 0; font-size: 16px; }
    .top p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
    .wrap { width: 100%; max-width: 440px; padding: 16px; text-align: center; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #34d399; background: #000; }
    .status { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 8px; background: #1f2937; }
    .btn {
      margin-top: 12px; padding: 12px 16px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
    }
    .btn-gray { background: #374151; color: #fff; }
  </style>
</head>
<body>
  <div class="top">
    <h1>RHU DUPAX DEL NORTE ABTC</h1>
    <p id="modeLabel">Live Camera Scanner (iPhone & Android)</p>
  </div>

  <div class="wrap">
    <div id="reader"></div>
    <div id="status" class="status">Starting rear camera... Allow camera permission when prompted.</div>
    <button class="btn btn-gray" onclick="goBack()">← Return to ABTC Web App</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get("mode") || "patient";
    const returnUrl = params.get("returnUrl") || "";
    let scanner = null;
    let handled = false;

    document.getElementById("modeLabel").textContent =
      mode === "inv" ? "Scanning Vaccine Box Barcode / GS1 QR" : "Scanning Patient PEP Card QR Code";

    function goBack() {
      if (returnUrl) window.location.href = returnUrl;
      else window.history.back();
    }

    function onScanSuccess(decodedText) {
      if (handled) return;
      handled = true;
      if (navigator.vibrate) navigator.vibrate(120);

      const clean = decodedText.trim();
      document.getElementById("status").innerHTML = `✅ Scanned: <b>${clean}</b><br>Opening ABTC System...`;

      if (scanner) scanner.stop().catch(() => {});

      if (!returnUrl) {
        alert("Scanned: " + clean);
        return;
      }

      if (mode === "inv") {
        window.location.href = `${returnUrl}?invCode=${encodeURIComponent(clean)}`;
      } else {
        let regNo = clean;
        try {
          if (clean.startsWith("http")) {
            const u = new URL(clean);
            if (u.searchParams.get("scan")) regNo = u.searchParams.get("scan");
          }
        } catch (e) {}
        window.location.href = `${returnUrl}?scan=${encodeURIComponent(regNo)}`;
      }
    }

    window.addEventListener("load", () => {
      const formats = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A
      ];

      scanner = new Html5Qrcode("reader", { formatsToSupport: formats, verbose: false });
      scanner.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 250, height: mode === "inv" ? 160 : 250 }, aspectRatio: 1.0 },
        onScanSuccess,
        () => {}
      ).then(() => {
        document.getElementById("status").textContent =
          mode === "inv" ? "Point rear camera at vaccine box barcode or 2D QR..." : "Point rear camera at patient's PEP Card QR code...";
      }).catch(err => {
        document.getElementById("status").innerHTML =
          `⚠️ Camera access denied or unavailable (${err}). Check iOS Safari / Android Chrome camera permissions.`;
      });
    });
  </script>
</body>
</html>
